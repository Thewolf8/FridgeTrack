name: Build FridgeTrack Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب ملفات المشروع الأساسية (بدون مجلد أندرويد)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. تثبيت حزم الجافاسكريبت المعتمدة في مشروعك
      - name: Install dependencies
        run: npm ci

      # 4. بناء ملفات الويب (مهم جداً لأن كاباسيتور يحتاجها قبل إنشاء الأندرويد)
      - name: Build web app
        run: npm run build

      # 5. توليد مجلد أندرويد كامل ونظيف بملفات جرادل الأصلية من الصفر
      - name: Create Android Project from Scratch
        run: |
          npm install @capacitor/cli @capacitor/android @capacitor/core
          npx cap add android
          npx cap sync android

      # 6. إعداد جافا 17 المطلوبة لمشروعك الجديد
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 7. إعطاء صلاحية التشغيل لملف gradlew الذي تم توليده للتو
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 8. بناء نسخة الـ Debug APK
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      # 9. رفع ملف الـ Debug APK لتنزيله
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FridgeTrack-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 10. بناء نسخة الـ Release APK
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      # 11. رفع ملف الـ Release APK لتنزيله
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FridgeTrack-release-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
